<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henry &amp; Tom's Jump Quest</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #10121c;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #10121c;
        color: #ffe27a;
        font-family: monospace;
        font-size: 22px;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      /* A phone held upright: tell the kid to turn it, rather than letting
         them fight a squashed layout. An iPad (wider than 600px) plays
         letterboxed upright instead — no overlay for it. */
      @media (orientation: portrait) and (max-width: 600px) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-overlay">Turn your phone sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
